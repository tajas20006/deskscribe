name: Version Check

on:
  pull_request:
    branches:
      - main

jobs:
  check-version-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compare project version against main
        run: |
          pr_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          main_version=$(git show "origin/${{ github.base_ref }}:pyproject.toml" | python3 -c "import sys, tomllib; print(tomllib.load(sys.stdin.buffer)['project']['version'])")
          echo "PR version: $pr_version"
          echo "main version: $main_version"
          if [ "$pr_version" = "$main_version" ]; then
            echo "::error::pyproject.toml の version が main と同じです（$pr_version）。リリースの重複を避けるため、マージ前に version を更新してください。"
            exit 1
          fi
