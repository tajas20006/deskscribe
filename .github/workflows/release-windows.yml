name: Build EXE

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build Windows distribution
        run: .\scripts\build_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DeskScribe-windows-x64
          path: |
            dist/DeskScribe.exe
            dist/DeskScribe-*-windows-x64.zip
            dist/DeskScribe-*-windows-x64.zip.sha256
          retention-days: 90

      - name: Get version
        id: version
        run: |
          $ver = (uv run python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          files: |
            dist/DeskScribe.exe
            dist/DeskScribe-*-windows-x64.zip
            dist/DeskScribe-*-windows-x64.zip.sha256
          make_latest: true
